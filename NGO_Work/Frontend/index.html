<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valmiki Samaj Charitable Trust</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-87TBW6KP15"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-87TBW6KP15', { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element" style="display: none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi,gu',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script>
      // Prevent Google Translate from translating Material Symbol icon text
      // (e.g. "expand_more", "star", "chevron_right" are text that the icon font renders as glyphs)
      (function() {
        function markIcons(root) {
          var icons = (root || document).querySelectorAll('.material-symbols-outlined');
          for (var i = 0; i < icons.length; i++) {
            icons[i].classList.add('notranslate');
            icons[i].setAttribute('translate', 'no');
          }
        }
        // Mark existing icons
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() { markIcons(); });
        } else {
          markIcons();
        }
        // Watch for dynamically added icons (React renders after initial load)
        var observer = new MutationObserver(function(mutations) {
          for (var i = 0; i < mutations.length; i++) {
            var added = mutations[i].addedNodes;
            for (var j = 0; j < added.length; j++) {
              if (added[j].nodeType === 1) {
                if (added[j].classList && added[j].classList.contains('material-symbols-outlined')) {
                  added[j].classList.add('notranslate');
                  added[j].setAttribute('translate', 'no');
                }
                markIcons(added[j]);
              }
            }
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
